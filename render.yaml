# Despliegue en Render (Blueprint): el backend como servicio web con Docker y su base PostgreSQL.
# En Render: Blueprints -> New Blueprint Instance -> este repositorio. Render crea los dos y los conecta.
services:
  - type: web
    name: splitbill-api
    runtime: docker
    plan: free
    region: virginia
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health
    # solo se vuelve a desplegar cuando cambia el backend, no con cada cambio de la app
    buildFilter:
      paths:
        - backend/**
    envVars:
      # la URL de la base; el Dockerfile la convierte al formato JDBC
      - key: DATABASE_URL
        fromDatabase:
          name: splitbill-db
          property: connectionString
      - key: DB_USER
        fromDatabase:
          name: splitbill-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: splitbill-db
          property: password
      # Render genera una clave aleatoria para firmar los tokens; nunca queda en el repositorio
      - key: JWT_SECRET
        generateValue: true
      # el plan gratuito tiene 512 MB: la JVM usa hasta el 75 % para el heap
      - key: JAVA_TOOL_OPTIONS
        value: -XX:MaxRAMPercentage=75

databases:
  - name: splitbill-db
    plan: free
    region: virginia
    databaseName: splitbill
    user: splitbill
    postgresMajorVersion: "17"
