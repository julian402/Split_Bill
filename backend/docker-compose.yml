# Base de datos de desarrollo. Se levanta con: docker compose up -d
# Lee las credenciales del archivo .env (ver .env.example); si no existe usa las de desarrollo.
services:
  postgres:
    image: postgres:17
    container_name: splitbill-postgres
    environment:
      POSTGRES_DB: splitbill
      POSTGRES_USER: ${DB_USER:-splitbill}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-splitbill}
    ports:
      - "5432:5432"
    volumes:
      - splitbill-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-splitbill} -d splitbill"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  splitbill-data:
